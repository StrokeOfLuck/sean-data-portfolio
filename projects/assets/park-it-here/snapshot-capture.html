<!doctype html><html lang="en"><head><meta charset="utf-8"><title>High density Technician archive capture</title><style>html,body{margin:0;padding:0;background:white}#stage{width:4320px;position:relative}iframe{position:absolute;left:0;top:0;border:0;width:1440px;height:13000px;transform:scale(3);transform-origin:top left;pointer-events:none}#stage{height:39000px}</style></head><body><div id="stage"><iframe id="article" src="park-it-here-archive.html?view=desktop&embed=1" title="Preserved publication"></iframe></div><script>const f=document.getElementById('article');function fit(){const d=f.contentDocument;if(!d)return;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight);f.style.height=h+'px';document.getElementById('stage').style.height=(h*3)+'px'}f.addEventListener('load',()=>{fit();new ResizeObserver(fit).observe(f.contentDocument.documentElement);setTimeout(fit,3000)})</script></body></html>
