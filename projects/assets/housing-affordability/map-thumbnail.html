<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NC State housing distance map preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0ee}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="preview" src="graphics/index.html" title="Original rental map centered on Main Campus distance circles" tabindex="-1"></iframe><script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument, element=doc.getElementById('map');
 if(!element)return;
 doc.body.appendChild(element);
 const style=doc.createElement('style');
 style.textContent='html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important}body>*{display:none!important}body>#map{display:block!important;position:fixed!important;inset:0!important;margin:0!important;width:100%!important;height:100%!important;border:0!important}.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right{display:none!important}.maplibregl-ctrl-attrib{font-size:9px!important}';
 doc.head.appendChild(style);
 const script=doc.createElement('script');
 script.textContent=`function frameThumbnail(){if(!map)return;map.resize();map.fitBounds([[-78.703,35.762],[-78.660,35.797]],{padding:16,duration:0});map.dragPan.disable();map.scrollZoom.disable();map.doubleClickZoom.disable();map.touchZoomRotate.disable();}frameThumbnail();if(map)map.once('load',frameThumbnail);new ResizeObserver(frameThumbnail).observe(document.body);`;
 doc.body.appendChild(script);
});
</script></body></html>
