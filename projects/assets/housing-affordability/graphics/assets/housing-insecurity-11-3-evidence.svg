    <text x="78" y="804" font-size="28">Secure</text><text x="963" y="804" font-size="28">1201</text><text x="1157" y="804" font-size="28">88.7%</text>

    <text x="42" y="882" font-size="22" fill="#666666">Recreated from the March 2024 NC State report for readable web reference. See the linked report for the original pages.</text>
