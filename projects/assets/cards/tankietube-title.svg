<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TankieTube poster artwork</title>
<desc id="desc">Cream and muted red poster reading TankieTube: Anti-Imperialist and Neo-Stalinist Subcultures on YouTube.</desc>
<rect width="1600" height="900" fill="#f3edcf"/>
<defs>
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
  </filter>
  <clipPath id="bannerClip">
    <path d="M95 180 Q800 20 1505 155 L1505 700 Q800 530 95 700 Z"/>
  </clipPath>
</defs>

<path d="M95 180 Q800 20 1505 155 L1505 700 Q800 530 95 700 Z" fill="#d55355"/>

<g clip-path="url(#bannerClip)" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">
  <text x="800" y="260" font-size="125" fill="#f3edcf" letter-spacing="4">TANKIETUBE:</text>
  <text x="800" y="365" font-size="98" fill="#f3edcf" letter-spacing="2">ANTI-IMPERIALIST</text>
  <text x="800" y="466" font-size="96" fill="#f3edcf" letter-spacing="1">&amp; NEO-STALINIST</text>
  <text x="800" y="570" font-size="108" fill="#f3edcf" letter-spacing="2">SUBCULTURES</text>
  <text x="800" y="675" font-size="116" fill="#303235" letter-spacing="4">ON YOUTUBE</text>
</g>

<path d="M120 710
 C220 670 360 670 520 700
 C690 735 830 805 945 895
 L650 895
 C540 825 410 785 290 765
 C225 755 165 752 120 758
 C175 742 220 728 255 716
 C205 718 160 726 120 738
 C170 718 215 700 255 687
 C200 694 155 704 120 718 Z"
 fill="#d55355"/>

<rect width="1600" height="900" filter="url(#grain)" opacity=".7"/>
</svg>