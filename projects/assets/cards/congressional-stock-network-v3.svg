<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <!-- Everything to the right of the thumbnail controls. Keeping this as a
         separate clip lets us move only the network without moving the UI. -->
    <clipPath id="graph-area" clipPathUnits="userSpaceOnUse">
      <rect x="560" y="0" width="1040" height="88"/>
      <rect x="663" y="88" width="937" height="78"/>
      <rect x="560" y="166" width="1040" height="36"/>
      <rect x="603" y="202" width="997" height="72"/>
      <rect x="560" y="274" width="1040" height="626"/>
    </clipPath>
  </defs>

  <!-- Original thumbnail preserves the title, search box, legend, and button. -->
  <image href="congressional-stock-network-v2.svg" x="0" y="0" width="1600" height="900"/>

  <!-- Remove the original network only, then redraw that same portion farther right. -->
  <g clip-path="url(#graph-area)">
    <rect x="0" y="0" width="1600" height="900" fill="#fbfcfd"/>
  </g>
  <g transform="translate(85 0)">
    <g clip-path="url(#graph-area)">
      <image href="congressional-stock-network-v2.svg" x="0" y="0" width="1600" height="900"/>
    </g>
  </g>
</svg>
