<!--
  Canonical nav bar snippet for standalone HTML pages living under
  projects/assets/<project-name>/<file>.html (three directories below the
  site root).

  This is a STATIC template, meant to be copy-pasted (with {ROOT} replaced
  by the correct relative path, normally "../../../" for that folder depth)
  directly into the page's <body>, right after the opening tag, with
  class="has-shared-nav" added to <body> itself. A runtime-JS-injected
  version was tried first and dropped: injecting it via script caused subtle
  render-order inconsistencies (colors/position settling slightly differently
  than a plain static navbar that's present from the first byte). Inlining
  this snippet directly avoids that entirely, at the cost of needing to
  paste an updated copy into each page if this file changes.

  Colors/sizes are pulled directly from the site's own compiled Bootstrap
  theme (cosmo), not guessed, so they should match exactly:
    - navbar background:  #f8f9fa
    - navbar text:        #545555
    - active/hover color: #1f4db5
-->
<style id="shared-site-nav-style">
html{overflow-x:hidden}
body.has-shared-nav{padding-top:0!important}
.site-nav{display:flex;align-items:baseline;gap:24px;padding:14px 24px;margin:0 calc(-50vw + 50%) 22px;background:#f8f9fa;border-bottom:1px solid #dee2e6;}
.site-nav-brand,.site-nav-brand:link,.site-nav-brand:visited{font-size:1.25em;font-weight:400;color:#545555;text-decoration:none;}
.site-nav-links{display:flex;align-items:baseline;gap:16px;}
.site-nav-links a,.site-nav-links a:link,.site-nav-links a:visited{font-size:1rem;font-weight:400;color:#545555;text-decoration:none;}
.site-nav-links a:hover,.site-nav-brand:hover{color:#1f4db5;}
.site-nav-github,.site-nav-github:link,.site-nav-github:visited{margin-left:auto;display:flex;align-items:center;color:#545555;}
.site-nav-github:hover{color:#1f4db5;}
@media (max-width:900px){.site-nav{padding:12px 16px;flex-wrap:wrap}}
</style>

<div class="site-nav">
<a class="site-nav-brand" href="{ROOT}index.html">Sean Ryan</a>
<div class="site-nav-links">
<a href="{ROOT}index.html">Work</a>
<a href="{ROOT}about.html">About</a>
<a href="{ROOT}cv.html">CV</a>
</div>
<a class="site-nav-github" href="https://github.com/StrokeOfLuck" aria-label="GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
</div>
