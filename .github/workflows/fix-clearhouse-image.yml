name: Fix ClearHouse image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clearhouse-image.yml'

permissions:
  contents: write

jobs:
  fix-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract real screenshot and update page
        shell: python
        run: |
          import base64
          import pathlib
          import re

          svg_path = pathlib.Path('projects/assets/clearhouse/clearhouse-live-2026-09-07.svg')
          webp_path = pathlib.Path('projects/assets/clearhouse/clearhouse-live-cropped.webp')
          qmd_path = pathlib.Path('projects/clearhouse.qmd')

          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'data:image/webp;base64,([^"\s]+)', svg)
          if not match:
              raise RuntimeError('Could not find embedded WebP in ClearHouse SVG')

          webp_path.write_bytes(base64.b64decode(match.group(1)))

          qmd = qmd_path.read_text(encoding='utf-8')
          qmd = qmd.replace(
              'assets/clearhouse/clearhouse-live-2026-09-07.svg',
              'assets/clearhouse/clearhouse-live-cropped.webp'
          )
          qmd_path.write_text(qmd, encoding='utf-8')
      - name: Commit direct image asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/assets/clearhouse/clearhouse-live-cropped.webp projects/clearhouse.qmd
          git commit -m "Use direct ClearHouse screenshot asset"
          git push
