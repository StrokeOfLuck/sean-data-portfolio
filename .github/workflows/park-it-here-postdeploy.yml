name: Finalize Park it here archive

on:
  workflow_run:
    workflows:
      - Deploy site
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-archive:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Restore snapshot, icons and fidelity stylesheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source_dir = Path("source/projects/assets/park-it-here")
          site_dir = Path("site/projects/assets/park-it-here")
          site_dir.mkdir(parents=True, exist_ok=True)

          for name in (
              "technician-publication-snapshot.png",
              "technician-exact.css",
              "technician-final-tweaks.css",
          ):
              src = source_dir / name
              dst = site_dir / name
              if not src.exists():
                  raise SystemExit(f"Missing source asset: {src}")
              shutil.copy2(src, dst)

          icon_src = source_dir / "icons"
          icon_dst = site_dir / "icons"
          if not icon_src.exists():
              raise SystemExit(f"Missing icon directory: {icon_src}")
          if icon_dst.exists():
              shutil.rmtree(icon_dst)
          shutil.copytree(icon_src, icon_dst)

          archive = site_dir / "park-it-here-archive.html"
          html = archive.read_text(encoding="utf-8")
          markers = [
              '<link rel="stylesheet" href="technician-exact.css" data-archive-exact-styles="1"/>',
              '<link rel="stylesheet" href="technician-final-tweaks.css" data-archive-final-tweaks="1"/>',
          ]
          changed = False
          for marker in markers:
              if marker not in html:
                  if "</head>" not in html:
                      raise SystemExit("Published archive is missing </head>")
                  html = html.replace("</head>", marker + "\n</head>", 1)
                  changed = True

          original_article = "https://technicianonline.com/162505/news/park-it-here-e-bike-and-scooter-rules-differ-across-nc-state/"
          mobile_header = (
              '<div class="archive-mobile-header" data-archive-mobile-header="1">\n'
              f'<a class="archive-mobile-header__button archive-mobile-header__menu" href="{original_article}" target="_blank" rel="noopener noreferrer" aria-label="Open original Technician article">\n'
              '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 8h24M4 16h24M4 24h24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>\n'
              '</a>\n'
              '<a class="archive-mobile-header__logo" href="https://technicianonline.com/" target="_blank" rel="noopener noreferrer" aria-label="Technician home">\n'
              '<img src="https://technicianonline.com/wp-content/uploads/2025/05/58d6e5cc-705c-11e6-a234-ff2269afdda9.webp" alt="Technician"/>\n'
              '</a>\n'
              f'<a class="archive-mobile-header__button archive-mobile-header__search" href="{original_article}" target="_blank" rel="noopener noreferrer" aria-label="Open original Technician article">\n'
              '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>\n'
              '</a>\n'
              '</div>'
          )
          if 'data-archive-mobile-header="1"' not in html:
              body_anchor = '<div class="bodywrap" data-desktop-breakpoint="1200"'
              idx = html.find(body_anchor)
              if idx == -1:
                  raise SystemExit("Published archive is missing bodywrap anchor")
              insert_at = html.find('>', idx)
              if insert_at == -1:
                  raise SystemExit("Published archive bodywrap tag is malformed")
              insert_at += 1
              html = html[:insert_at] + "\n" + mobile_header + html[insert_at:]
              changed = True

          # Full-page screenshots do not necessarily scroll through the page,
          # so lazy Datawrapper iframes may never initialize. Load the preserved
          # live maps eagerly instead; their own postMessage sizing still applies.
          lazy = 'class="dw-live-frame" data-external="1" frameborder="0" loading="lazy"'
          eager = 'class="dw-live-frame" data-external="1" frameborder="0" loading="eager"'
          if lazy in html:
              html = html.replace(lazy, eager)
              changed = True

          if changed:
              archive.write_text(html, encoding="utf-8")

          print(f"Snapshot: {(site_dir / 'technician-publication-snapshot.png').stat().st_size:,} bytes")
          print("Technician desktop fidelity, mobile masthead, live maps and local social icons finalized.")
          PY

      - name: Commit published archive fixes
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png
          git add projects/assets/park-it-here/technician-exact.css
          git add projects/assets/park-it-here/technician-final-tweaks.css
          git add projects/assets/park-it-here/icons
          git add projects/assets/park-it-here/park-it-here-archive.html
          if git diff --cached --quiet; then
            echo 'Published archive already finalized.'
            exit 0
          fi
          git commit -m 'Finalize Park it here archive assets and styling'
          git push origin gh-pages
