name: Finalize Park it here archive

on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize-archive:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Restore snapshot and exact Technician typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source_asset = Path("source/projects/assets/park-it-here/technician-publication-snapshot.png")
          published_asset = Path("site/projects/assets/park-it-here/technician-publication-snapshot.png")
          if not source_asset.exists():
              raise SystemExit(f"Missing source snapshot: {source_asset}")
          published_asset.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_asset, published_asset)

          archive = Path("site/projects/assets/park-it-here/park-it-here-archive.html")
          html = archive.read_text(encoding="utf-8")

          start_marker = '<!-- archive-exact-technician-styles:start -->'
          end_marker = '<!-- archive-exact-technician-styles:end -->'
          if start_marker in html and end_marker in html:
              before, rest = html.split(start_marker, 1)
              _, after = rest.split(end_marker, 1)
              html = before + after

          fidelity = r'''<!-- archive-exact-technician-styles:start -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style id="archive-exact-technician-styles">
/* Values copied from the captured Technician page so the mirror uses the
   publication's actual typography and spacing rather than approximations. */
body, #wrap, #upperwrap {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
  font-weight: 400 !important;
}

.sno-hac-inner-desktop-4 .sno-hac-menuwrap {
  margin-top: 0 !important;
  background: #231f20 !important;
  color: #ffffff !important;
  line-height: 50px !important;
  height: 50px !important;
  font-weight: normal !important;
  font-family: "Playfair Display", Georgia, serif !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  width: 100% !important;
  text-transform: uppercase !important;
}
.sno-hac-inner-desktop-4 .sno-hac-menuwrap li {
  background: #231f20 !important;
  color: #ffffff !important;
  line-height: 50px !important;
  font-size: 16px !important;
  font-family: "Playfair Display", Georgia, serif !important;
  font-weight: normal !important;
}
.sno-hac-inner-desktop-4 .sno-hac-menuwrap li a:not(.menuheadline) {
  color: #ffffff !important;
  line-height: 50px !important;
  font-family: "Playfair Display", Georgia, serif !important;
  font-weight: normal !important;
}
.sno-hac-inner-desktop-4 .sno-hac-menuwrap a:not(.menuheadline):hover,
.sno-hac-inner-desktop-4 .sno-hac-menuwrap a:not(.menuheadline):focus {
  background: #ffffff !important;
  color: #000000 !important;
}

/* Superfish normally adds the dropdown-arrow class with JavaScript. The
   static archive does not run that initialization, so reproduce the same
   arrow directly on menu items that actually have children. */
.sno-hac-inner-desktop-4 #menu-menu-tester > li.menu-item-has-children > a {
  position: relative !important;
  padding-right: 2.5em !important;
}
.sno-hac-inner-desktop-4 #menu-menu-tester > li.menu-item-has-children > a::after {
  content: "" !important;
  position: absolute !important;
  top: 50% !important;
  right: 1em !important;
  width: 0 !important;
  height: 0 !important;
  margin-top: -3px !important;
  border: 5px solid transparent !important;
  border-top-color: #ffffff !important;
}
.sno-hac-inner-desktop-4 #menu-menu-tester > li.menu-item-has-children:hover > a::after,
.sno-hac-inner-desktop-4 #menu-menu-tester > li.menu-item-has-children > a:focus::after {
  border-top-color: #000000 !important;
}

.sno-story-page {
  background: #ffffff !important;
  padding-top: 20px !important;
}
.sno-story-wrap {
  padding: 35px 0 !important;
  margin-left: auto !important;
  margin-right: auto !important;
  max-width: 1200px !important;
  width: 800px !important;
}
h1.sno-story-headline {
  margin-top: 0 !important;
  font-size: 44px !important;
  line-height: 1.35em !important;
  text-align: left !important;
  margin-bottom: 0 !important;
  font-family: "Myriad Pro", Arial, Helvetica, sans-serif !important;
  font-weight: 600 !important;
}
h1.sno-story-headline:not(.headline-wrap) {
  color: #000000 !important;
  padding-top: 15px !important;
  padding-bottom: 15px !important;
}
.sno-story-byline.byline-post-162505 {
  font-size: 16px !important;
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
  font-weight: 400 !important;
  font-style: normal !important;
  letter-spacing: 0 !important;
  padding: 5px 0 !important;
  margin-bottom: 20px !important;
  color: #000000 !important;
  border-top: 0 solid #eeeeee !important;
  border-bottom: 0 solid #eeeeee !important;
}
.sno-story-byline.byline-post-162505 a {
  color: #cc0000 !important;
}
.sno-story-body p:not(.infographic-widget-container p, .imagelink-wrap p, .sno-infobox p),
.sno-collection-body p,
.live-update-wrap p {
  font-size: 20px !important;
  line-height: 1.4em !important;
  margin-bottom: 15px !important;
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
  color: #000000 !important;
}
.sno-story-body ul,
.sno-story-body ol,
.sno-story-body li {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
  color: #000000 !important;
}
.sno-story-body li {
  font-size: 20px !important;
  line-height: 1.4em !important;
}
.sno-story-body a {
  color: #cc0000 !important;
}

@media only screen and (max-width: 800px) {
  .sno-story-wrap {
    width: 100% !important;
    max-width: 100% !important;
  }
  h1.sno-story-headline {
    margin-left: 20px !important;
    margin-right: 20px !important;
  }
}
@media only screen and (max-width: 600px) {
  .sno-story-body p:not(.infographic-widget-container p),
  .sno-story-body p.pullquotetext,
  .sno-story-body p.quotespeaker,
  .live-update-wrap p {
    font-size: 18px !important;
    line-height: 1.4em !important;
  }
}
</style>
<!-- archive-exact-technician-styles:end -->'''

          if "</head>" not in html:
              raise SystemExit("Published archive is missing </head>")
          html = html.replace("</head>", fidelity + "\n</head>", 1)
          archive.write_text(html, encoding="utf-8")

          print(f"Copied snapshot: {published_asset.stat().st_size:,} bytes")
          print("Injected captured Technician typography and Multimedia dropdown arrow.")
          PY

      - name: Commit published archive fixes
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png \
                  projects/assets/park-it-here/park-it-here-archive.html
          if git diff --cached --quiet; then
            echo 'Published archive already finalized.'
            exit 0
          fi
          git commit -m 'Finalize Park it here archive assets and styling'
          git push origin gh-pages
