name: Finalize Park it here archive

on:
  workflow_run:
    workflows:
      - Deploy site
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-archive:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Restore snapshot, photo, icons and fidelity stylesheets
        run: |
          set -euo pipefail

          PHOTO='site/projects/assets/park-it-here/spin-scooter-alex-manuel.jpg'
          PHOTO_URL='https://technicianonline.com/wp-content/uploads/2024/11/cf99f0db034483efd353a21087d5ff33-1200x801.jpg'
          mkdir -p "$(dirname "$PHOTO")"

          # Preserve the newly added Technician lead image locally on gh-pages.
          # Once it has been archived, subsequent runs keep the local copy even
          # if the publication later removes or replaces the source asset.
          if [ ! -s "$PHOTO" ]; then
            curl -L --fail --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0' \
              "$PHOTO_URL" \
              -o "$PHOTO"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source_dir = Path("source/projects/assets/park-it-here")
          site_dir = Path("site/projects/assets/park-it-here")
          site_dir.mkdir(parents=True, exist_ok=True)

          for name in (
              "technician-publication-snapshot.png",
              "technician-exact.css",
              "technician-final-tweaks.css",
          ):
              src = source_dir / name
              dst = site_dir / name
              if not src.exists():
                  raise SystemExit(f"Missing source asset: {src}")
              shutil.copy2(src, dst)

          photo = site_dir / "spin-scooter-alex-manuel.jpg"
          if not photo.exists() or photo.stat().st_size == 0:
              raise SystemExit(f"Missing archived Technician photo: {photo}")

          icon_src = source_dir / "icons"
          icon_dst = site_dir / "icons"
          if not icon_src.exists():
              raise SystemExit(f"Missing icon directory: {icon_src}")
          if icon_dst.exists():
              shutil.rmtree(icon_dst)
          shutil.copytree(icon_src, icon_dst)

          archive = site_dir / "park-it-here-archive.html"
          html = archive.read_text(encoding="utf-8")
          markers = [
              '<link rel="stylesheet" href="technician-exact.css" data-archive-exact-styles="1"/>',
              '<link rel="stylesheet" href="technician-final-tweaks.css" data-archive-final-tweaks="1"/>',
          ]
          changed = False
          for marker in markers:
              if marker not in html:
                  if "</head>" not in html:
                      raise SystemExit("Published archive is missing </head>")
                  html = html.replace("</head>", marker + "\n</head>", 1)
                  changed = True

          # Technician added a lead photo after publication. Preserve the exact
          # current image, credit and caption immediately before the first Spin
          # Datawrapper map so the archive follows the live article's new order.
          photo_marker = 'data-archive-added-photo="spin-scooter-alex-manuel"'
          if photo_marker not in html:
              first_map = "https://datawrapper.dwcdn.net/28Wwl/"
              map_pos = html.find(first_map)
              if map_pos == -1:
                  raise SystemExit("Could not find the first Spin Datawrapper map")

              insert_at = html.rfind('<div class="dw-hybrid', 0, map_pos)
              if insert_at == -1:
                  raise SystemExit("Could not find the first Datawrapper wrapper")

              photo_html = '''
<figure class="archive-technician-photo" data-archive-added-photo="spin-scooter-alex-manuel" style="margin:0 0 30px;width:100%;background:#eeeeee;">
<img src="spin-scooter-alex-manuel.jpg" width="1200" height="801" alt="A Spin electric scooter lies sideways in the Court of North Carolina" data-original-src="https://technicianonline.com/wp-content/uploads/2024/11/cf99f0db034483efd353a21087d5ff33-1200x801.jpg" style="display:block;width:100%;height:auto;margin:0;"/>
<figcaption style="box-sizing:border-box;width:100%;margin:0;padding:9px 12px 12px;background:#eeeeee;color:#000000;font-family:&quot;Source Serif 4&quot;;font-size:16px;line-height:1.35em;font-style:italic;">
<span style="display:block;margin:0 0 6px;color:#cc0000;">Alex Manuel</span>
A Spin electric scooter lies sideways in the court of North Carolina on Monday, Nov. 18, 2024. Spin is a leading micromobility company and a unit of Ford Mobility, currently operating electric scooters in many cities and universities nationwide. At NC State, Spin scooters are deployed on North, Central, South, and Centennial Campuses.
</figcaption>
</figure>
'''
              html = html[:insert_at] + photo_html + html[insert_at:]
              changed = True

          # Older preservation passes injected a second mobile masthead. The
          # captured Technician HTML already includes its genuine phone header,
          # so remove the duplicate if it is ever present in a published copy.
          mobile_marker = '<div class="archive-mobile-header" data-archive-mobile-header="1">'
          while mobile_marker in html:
              start = html.index(mobile_marker)
              end = html.find('</div>', start)
              if end == -1:
                  raise SystemExit("Injected mobile header is malformed")
              html = html[:start] + html[end + len('</div>'):]
              changed = True

          # Full-page screenshots do not necessarily scroll through the page,
          # so lazy Datawrapper iframes may never initialize. Load the preserved
          # live maps eagerly instead; their own postMessage sizing still applies.
          lazy = 'class="dw-live-frame" data-external="1" frameborder="0" loading="lazy"'
          eager = 'class="dw-live-frame" data-external="1" frameborder="0" loading="eager"'
          if lazy in html:
              html = html.replace(lazy, eager)
              changed = True

          if changed:
              archive.write_text(html, encoding="utf-8")

          print(f"Snapshot: {(site_dir / 'technician-publication-snapshot.png').stat().st_size:,} bytes")
          print(f"Archived lead photo: {photo.stat().st_size:,} bytes")
          print("Technician desktop/mobile fidelity, lead photo, live maps and local social icons finalized.")
          PY

      - name: Commit published archive fixes
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png
          git add projects/assets/park-it-here/technician-exact.css
          git add projects/assets/park-it-here/technician-final-tweaks.css
          git add projects/assets/park-it-here/icons
          git add projects/assets/park-it-here/spin-scooter-alex-manuel.jpg
          git add projects/assets/park-it-here/park-it-here-archive.html
          if git diff --cached --quiet; then
            echo 'Published archive already finalized.'
            exit 0
          fi
          git commit -m 'Finalize Park it here archive assets and styling'
          git push origin gh-pages
