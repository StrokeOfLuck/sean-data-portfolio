name: Finalize Park it here archive

on:
  workflow_run:
    workflows:
      - Deploy site
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-archive:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Sync latest publication snapshot into repository
        run: |
          set -euo pipefail

          SNAPSHOT='source/projects/assets/park-it-here/technician-publication-snapshot.png'
          TMP='/tmp/technician-publication-snapshot.png'
          DRIVE_URL='https://drive.google.com/uc?export=download&id=1ME743-sSD243gDGnAgk4nuSaxt24VyGw'
          EXPECTED_SHA='afe97d08cff006030ad5a28678d10d6562e5c97d3989fbca3cf0038d55141acb'

          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            "$DRIVE_URL" \
            -o "$TMP"

          ACTUAL_SHA="$(sha256sum "$TMP" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Snapshot hash mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            file "$TMP" || true
            exit 1
          fi

          mkdir -p "$(dirname "$SNAPSHOT")"
          mv "$TMP" "$SNAPSHOT"

          python3 - <<'PY'
          from pathlib import Path

          qmd = Path('source/projects/park-it-here.qmd')
          text = qmd.read_text(encoding='utf-8')
          drive = 'https://drive.google.com/file/d/1ME743-sSD243gDGnAgk4nuSaxt24VyGw/view?usp=drivesdk'
          local = 'assets/park-it-here/technician-publication-snapshot.png'
          if drive in text:
              text = text.replace(drive, local)
              qmd.write_text(text, encoding='utf-8')

          obsolete = Path('source/projects/assets/park-it-here/technician-publication-snapshot.jpg.b64')
          if obsolete.exists():
              obsolete.unlink()
          PY

          echo "Verified exact snapshot: $(stat -c%s "$SNAPSHOT") bytes"

      - name: Commit source snapshot and cleanup
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png
          git add projects/park-it-here.qmd
          git add -u projects/assets/park-it-here/
          if git diff --cached --quiet; then
            echo 'Source snapshot already current.'
          else
            git commit -m 'Replace Technician publication snapshot'
            git push origin main
          fi

      - name: Restore snapshot, photo, icons and fidelity stylesheets
        run: |
          set -euo pipefail

          PHOTO='site/projects/assets/park-it-here/spin-scooter-alex-manuel.jpg'
          PHOTO_URL='https://technicianonline.com/wp-content/uploads/2024/11/cf99f0db034483efd353a21087d5ff33-1200x801.jpg'
          mkdir -p "$(dirname "$PHOTO")"

          if [ ! -s "$PHOTO" ]; then
            curl -L --fail --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0' \
              "$PHOTO_URL" \
              -o "$PHOTO"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source_dir = Path("source/projects/assets/park-it-here")
          site_dir = Path("site/projects/assets/park-it-here")
          site_dir.mkdir(parents=True, exist_ok=True)

          for name in (
              "technician-publication-snapshot.png",
              "technician-exact.css",
              "technician-final-tweaks.css",
          ):
              src = source_dir / name
              dst = site_dir / name
              if not src.exists():
                  raise SystemExit(f"Missing source asset: {src}")
              shutil.copy2(src, dst)

          photo = site_dir / "spin-scooter-alex-manuel.jpg"
          if not photo.exists() or photo.stat().st_size == 0:
              raise SystemExit(f"Missing archived Technician photo: {photo}")

          icon_src = source_dir / "icons"
          icon_dst = site_dir / "icons"
          if not icon_src.exists():
              raise SystemExit(f"Missing icon directory: {icon_src}")
          if icon_dst.exists():
              shutil.rmtree(icon_dst)
          shutil.copytree(icon_src, icon_dst)

          rendered = Path("site/projects/park-it-here.html")
          if rendered.exists():
              page = rendered.read_text(encoding="utf-8")
              page = page.replace(
                  "https://drive.google.com/file/d/1ME743-sSD243gDGnAgk4nuSaxt24VyGw/view?usp=drivesdk",
                  "assets/park-it-here/technician-publication-snapshot.png",
              )
              rendered.write_text(page, encoding="utf-8")

          archive = site_dir / "park-it-here-archive.html"
          html = archive.read_text(encoding="utf-8")
          markers = [
              '<link rel="stylesheet" href="technician-exact.css" data-archive-exact-styles="1"/>',
              '<link rel="stylesheet" href="technician-final-tweaks.css" data-archive-final-tweaks="1"/>',
          ]
          changed = False
          for marker in markers:
              if marker not in html:
                  if "</head>" not in html:
                      raise SystemExit("Published archive is missing </head>")
                  html = html.replace("</head>", marker + "\n</head>", 1)
                  changed = True

          stale_last_mile = '<link rel="stylesheet" href="technician-last-mile.css" data-archive-last-mile="1"/>'
          if stale_last_mile in html:
              html = html.replace(stale_last_mile, "")
              changed = True

          photo_marker = 'data-archive-added-photo="spin-scooter-alex-manuel"'
          if photo_marker not in html:
              first_map = "https://datawrapper.dwcdn.net/28Wwl/"
              map_pos = html.find(first_map)
              if map_pos == -1:
                  raise SystemExit("Could not find the first Spin Datawrapper map")

              insert_at = html.rfind('<div class="dw-hybrid', 0, map_pos)
              if insert_at == -1:
                  raise SystemExit("Could not find the first Datawrapper wrapper")

              photo_html = (
                  '\n<figure class="archive-technician-photo" data-archive-added-photo="spin-scooter-alex-manuel" style="margin:0 0 30px;width:100%;background:#eeeeee;">\n'
                  '<img src="spin-scooter-alex-manuel.jpg" width="1200" height="801" alt="A Spin electric scooter lies sideways in the Court of North Carolina" data-original-src="https://technicianonline.com/wp-content/uploads/2024/11/cf99f0db034483efd353a21087d5ff33-1200x801.jpg" style="display:block;width:100%;height:auto;margin:0;"/>\n'
                  '<figcaption style="box-sizing:border-box;width:100%;margin:0;padding:9px 12px 12px;background:#eeeeee;color:#000000;font-family:&quot;Source Serif 4&quot;;font-size:16px;line-height:1.35em;font-style:italic;">\n'
                  '<span style="display:block;margin:0 0 6px;color:#cc0000;">Alex Manuel</span>\n'
                  'A Spin electric scooter lies sideways in the court of North Carolina on Monday, Nov. 18, 2024. Spin is a leading micromobility company and a unit of Ford Mobility, currently operating electric scooters in many cities and universities nationwide. At NC State, Spin scooters are deployed on North, Central, South, and Centennial Campuses.\n'
                  '</figcaption>\n'
                  '</figure>\n'
              )
              html = html[:insert_at] + photo_html + html[insert_at:]
              changed = True

          # Rebuild the contributor once, after the complete More in News block.
          contributor_start = html.find('<section class="archive-contributor"')
          while contributor_start != -1:
              contributor_end = html.find('</section>', contributor_start)
              if contributor_end == -1:
                  raise SystemExit("Existing contributor block is malformed")
              html = html[:contributor_start] + html[contributor_end + len('</section>'):]
              changed = True
              contributor_start = html.find('<section class="archive-contributor"')

          related_start = html.find('<div class="related-term-container">')
          if related_start == -1:
              raise SystemExit("Could not find More in News container")

          token_re = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
          depth = 0
          related_end = None
          for match in token_re.finditer(html, related_start):
              token = match.group(0).lower()
              if token.startswith('<div'):
                  depth += 1
              else:
                  depth -= 1
                  if depth == 0:
                      related_end = match.end()
                      break
          if related_end is None:
              raise SystemExit("Could not find end of More in News container")

          contributor_html = (
              '\n<section class="archive-contributor" data-archive-contributor="alex-manuel" aria-labelledby="archive-contributor-title">\n'
              '<h2 class="archive-contributor-title" id="archive-contributor-title">About the Contributor</h2>\n'
              '<p class="archive-contributor-line"><a href="https://technicianonline.com/staff_name/alex-manuel/" target="_blank" rel="noopener noreferrer">Alex Manuel</a>, Photo Editor</p>\n'
              '</section>\n'
          )
          html = html[:related_end] + contributor_html + html[related_end:]
          changed = True

          mobile_marker = '<div class="archive-mobile-header" data-archive-mobile-header="1">'
          while mobile_marker in html:
              start = html.index(mobile_marker)
              end = html.find('</div>', start)
              if end == -1:
                  raise SystemExit("Injected mobile header is malformed")
              html = html[:start] + html[end + len('</div>'):]
              changed = True

          lazy = 'class="dw-live-frame" data-external="1" frameborder="0" loading="lazy"'
          eager = 'class="dw-live-frame" data-external="1" frameborder="0" loading="eager"'
          if lazy in html:
              html = html.replace(lazy, eager)
              changed = True

          if changed:
              archive.write_text(html, encoding="utf-8")

          print(f"Snapshot: {(site_dir / 'technician-publication-snapshot.png').stat().st_size:,} bytes")
          print(f"Archived lead photo: {photo.stat().st_size:,} bytes")
          print("Technician archive finalized with contributor below More in News.")
          PY

      - name: Commit published archive fixes
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png
          git add projects/assets/park-it-here/technician-exact.css
          git add projects/assets/park-it-here/technician-final-tweaks.css
          git add projects/assets/park-it-here/icons
          git add projects/assets/park-it-here/spin-scooter-alex-manuel.jpg
          git add projects/assets/park-it-here/park-it-here-archive.html
          git add projects/park-it-here.html
          if git diff --cached --quiet; then
            echo 'Published archive already finalized.'
            exit 0
          fi
          git commit -m 'Finalize Park it here archive assets and styling'
          git push origin gh-pages
