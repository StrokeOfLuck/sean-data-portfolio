name: Patch About ball physics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-about-ball.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair About CSS and validate script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('about.qmd')
          text = path.read_text()

          good_wrap = '''  .photo-wrap {
            width:var(--about-photo-size);
            height:var(--about-photo-size);
            position:relative;
            touch-action:none;
            cursor:grab;
            border-radius:50%;
            overflow:hidden;
          }'''
          bad_wrap = r'''  \1\n    border-radius:50%;\n    overflow:hidden;\2'''
          if bad_wrap not in text:
              raise SystemExit('Corrupt desktop photo-wrap marker not found')
          text = text.replace(bad_wrap, good_wrap, 1)

          good_photo = '''  .photo {
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:50%;
            display:block;
            user-select:none;
            -webkit-user-drag:none;
          }'''
          text, n = re.subn(
              r'\s*\\1border-radius:50%;\s*display:block;\s*user-select:none;\s*-webkit-user-drag:none;\s*\}',
              lambda m: '\n\n' + good_photo,
              text,
              count=1
          )
          if n != 1:
              raise SystemExit(f'Corrupt desktop photo block replacement count {n}')

          good_mobile = '''  @media(max-width:760px) {
            html,
            body {
              height:100%;
              overflow:hidden;
            }

            .page {
              height:calc(100dvh - 54px);
              min-height:0;
              padding:8px 18px 0;
              overflow:hidden;
            }

            .page h1 {
              font-size:26px;
              margin:0 0 10px;
            }

            .intro {
              grid-template-columns:minmax(0,1fr) 118px;
              gap:14px;
              align-items:start;
            }

            .copy {
              max-width:none;
              font-size:13px;
              line-height:1.45;
            }

            .copy p {
              margin:0 0 12px;
            }

            .photo-wrap {
              width:118px;
              height:118px;
              aspect-ratio:1;
            }

            .photo {
              border-radius:50%;
            }'''
          text, n = re.subn(
              r'\s*\\1border-radius:50%;\s*\}',
              lambda m: '\n\n' + good_mobile,
              text,
              count=1
          )
          if n != 1:
              raise SystemExit(f'Corrupt mobile CSS replacement count {n}')

          if r'\1' in text or r'\2' in text:
              raise SystemExit('Backreference artifact still present')

          required = [
              '.photo-wrap {',
              'border-radius:50%;',
              "shape:'circle'",
              'restitution:.72',
              'function restoreWordsOnly()',
              'Text physics disabled; photo ball stays active',
              "if(under?.closest?.('#photoWrap') && photoWrap.dataset.detached!=='1') {",
              'ctx.arc(0,0,r,0,Math.PI*2);'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing expected About marker: {marker}')

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/about-script.js').write_text('\n'.join(scripts))

          path.write_text(text)
          print('About CSS repaired and physics markers validated')
          PY

          node --check /tmp/about-script.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.qmd
          git diff --cached --check
          git commit -m "Repair About photo ball styling"
          git push origin main
