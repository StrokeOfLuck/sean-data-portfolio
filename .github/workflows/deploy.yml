name: Deploy site

on:
  repository_dispatch:
    types: [senate-data-updated, house-data-updated]
  schedule:
    # Weekly fallback rebuild (Mondays 12:00 UTC) in case a dispatch is
    # ever missed, or House data is refreshed manually without a push.
    - cron: "0 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sean-data-portfolio
        uses: actions/checkout@v4

      - name: Apply About photo ball toggle source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('about.qmd')
          text = path.read_text()

          if 'id="photoPhysics"' not in text:
              def replace_once(old, new, label):
                  global text
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected 1 match, found {count}')
                  text = text.replace(old, new, 1)

              replace_once(
                  '    <button id="pageLock" title="Keep text fixed while photo physics stay active" aria-label="Zen mode off. Text physics enabled.">Zen mode off</button>\n    <button id="reset">Reset</button>',
                  '    <button id="pageLock" title="Keep text fixed while photo physics stay active" aria-label="Zen mode off. Text physics enabled.">Zen mode off</button>\n    <button id="photoPhysics" class="active" title="Photo can be knocked loose and bounce" aria-label="Photo ball physics on.">Photo ball on</button>\n    <button id="reset">Reset</button>',
                  'settings button'
              )

              replace_once(
                  "  const pageLockButton = document.getElementById('pageLock');\n  const telemetryToggle = document.getElementById('telemetryToggle');",
                  "  const pageLockButton = document.getElementById('pageLock');\n  const photoPhysicsButton = document.getElementById('photoPhysics');\n  const telemetryToggle = document.getElementById('telemetryToggle');",
                  'photo button const'
              )

              replace_once(
                  '  let pageLocked=false;\n  let cameraShiftY=0;',
                  '  let pageLocked=false;\n  let photoPhysicsEnabled=true;\n  let cameraShiftY=0;',
                  'photo physics state'
              )

              replace_once(
                  "  function detachPhoto(vx=0,vy=0) {\n  if(photoWrap.dataset.detached==='1') return bodies.find(b=>b.type==='photo')||null;",
                  "  function detachPhoto(vx=0,vy=0) {\n  if(!photoPhysicsEnabled) return null;\n  if(photoWrap.dataset.detached==='1') return bodies.find(b=>b.type==='photo')||null;",
                  'detach guard'
              )

              replace_once(
                  "function restoreWordsAndPhoto() {",
                  "function restorePhotoOnly() {\n  if(dragging?.type==='photo') {\n    dragging.held=false;\n    dragging=null;\n    window.removeEventListener('pointermove',onDragMove);\n    window.removeEventListener('pointerup',onDragEnd);\n  }\n  if(pendingStatic?.kind==='photo') clearPendingStatic();\n  bodies=bodies.filter(b=>b.type!=='photo');\n  photoWrap.dataset.detached='';\n  photoWrap.style.visibility='';\n}\n\nfunction restoreWordsAndPhoto() {",
                  'restore photo helper'
              )

              replace_once(
                  "    if(zenNote) zenNote.style.display='block';",
                  "    if(zenNote) {\n      zenNote.textContent=photoPhysicsEnabled\n        ? 'Text physics disabled; photo ball stays active'\n        : 'Text physics disabled; photo ball physics disabled';\n      zenNote.style.display='block';\n    }",
                  'zen note state'
              )

              marker = "\nfunction reset() {"
              if text.count(marker) != 1:
                  raise SystemExit(f'photo toggle function marker: expected 1 match, found {text.count(marker)}')

              photo_toggle_fn = """

function setPhotoPhysics(next) {
  photoPhysicsEnabled=next;

  if(!photoPhysicsEnabled) restorePhotoOnly();

  if(photoPhysicsButton) {
    photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo ball on' : 'Photo ball off';
    photoPhysicsButton.title=photoPhysicsEnabled
      ? 'Photo can be knocked loose and bounce'
      : 'Photo stays fixed in place';
    photoPhysicsButton.setAttribute(
      'aria-label',
      photoPhysicsEnabled ? 'Photo ball physics on.' : 'Photo ball physics off.'
    );
    photoPhysicsButton.classList.toggle('active',photoPhysicsEnabled);
  }

  photoWrap.classList.toggle('physics-disabled',!photoPhysicsEnabled);

  const zenNote=document.getElementById('zenNote');
  if(pageLocked && zenNote) {
    zenNote.textContent=photoPhysicsEnabled
      ? 'Text physics disabled; photo ball stays active'
      : 'Text physics disabled; photo ball physics disabled';
  }
}
"""
              text = text.replace(marker, photo_toggle_fn + marker, 1)

              replace_once(
                  "  if(photoWrap.dataset.detached!=='1' && hitStaticRect(bike.x,bike.y,r+10,photoWrap.getBoundingClientRect())) {",
                  "  if(photoPhysicsEnabled && photoWrap.dataset.detached!=='1' && hitStaticRect(bike.x,bike.y,r+10,photoWrap.getBoundingClientRect())) {",
                  'bike photo collision guard'
              )

              replace_once(
                  "  if(photoWrap.dataset.detached!=='1' && body.type!=='photo' && hitStaticRect(body.x,body.y,r+12,photoWrap.getBoundingClientRect())) {",
                  "  if(photoPhysicsEnabled && photoWrap.dataset.detached!=='1' && body.type!=='photo' && hitStaticRect(body.x,body.y,r+12,photoWrap.getBoundingClientRect())) {",
                  'body photo collision guard'
              )

              replace_once(
                  "    if(under?.closest?.('#photoWrap') && photoWrap.dataset.detached!=='1') {",
                  "    if(photoPhysicsEnabled && under?.closest?.('#photoWrap') && photoWrap.dataset.detached!=='1') {",
                  'photo pointer guard'
              )

              replace_once(
                  "  pageLockButton.addEventListener('click',e=>{\n    e.stopPropagation();\n    setPageLocked(!pageLocked);\n  });",
                  "  pageLockButton.addEventListener('click',e=>{\n    e.stopPropagation();\n    setPageLocked(!pageLocked);\n  });\n\n  photoPhysicsButton?.addEventListener('click',e=>{\n    e.stopPropagation();\n    setPhotoPhysics(!photoPhysicsEnabled);\n  });",
                  'photo toggle listener'
              )

              replace_once(
                  "  .photo-wrap:active { cursor:grabbing; }\n  body.page-locked .photo-wrap { cursor:grab; }",
                  "  .photo-wrap:active { cursor:grabbing; }\n  body.page-locked .photo-wrap { cursor:grab; }\n  .photo-wrap.physics-disabled,\n  .photo-wrap.physics-disabled:active { cursor:default; }",
                  'photo disabled cursor'
              )

              path.write_text(text)
              print('Added independent photo ball physics toggle')
          else:
              print('Photo ball toggle already present')

          text = path.read_text()
          required = [
              'id="photoPhysics"',
              'let photoPhysicsEnabled=true;',
              'function setPhotoPhysics(next)',
              'if(!photoPhysicsEnabled) return null;',
              "if(photoPhysicsEnabled && under?.closest?.('#photoWrap')",
              "photoPhysicsButton?.addEventListener('click'"
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected marker: {item}')

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/about-script.js').write_text('\n'.join(scripts))
          PY

          node --check /tmp/about-script.js

          if git diff --quiet -- about.qmd; then
            echo "About source already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add about.qmd
            git commit -m "Add independent photo ball physics toggle"
            git push origin main
          fi

      # actions/checkout refuses any `path` that escapes $GITHUB_WORKSPACE via
      # "..", so this lands *inside* the sean-data-portfolio checkout as
      # senate-ptr-scraper/ rather than as a true sibling folder (which is
      # how it looks in local development). The Quarto page's data path
      # tries both layouts and uses whichever exists.
      - name: Checkout senate-ptr-scraper (for Senate data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/senate-ptr-scraper
          path: senate-ptr-scraper

      - name: Checkout house-ptr-scraper (for House data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/house-ptr-scraper
          path: house-ptr-scraper

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::readr
            any::dplyr
            any::DT
            any::jsonlite
            any::htmltools
            any::yaml
            any::glue
            any::purrr

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
