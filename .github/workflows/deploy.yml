name: Deploy site

on:
  repository_dispatch:
    types: [senate-data-updated, house-data-updated]
  schedule:
    # Weekly fallback rebuild (Mondays 12:00 UTC) in case a dispatch is
    # ever missed, or House data is refreshed manually without a push.
    - cron: "0 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sean-data-portfolio
        uses: actions/checkout@v4

      - name: Clarify About physics control labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('about.qmd')
          text = path.read_text()
          original = text

          text = text.replace(
              '<button id="pageLock" title="Keep text fixed while photo physics stay active" aria-label="Zen mode off. Text physics enabled.">Zen mode off</button>',
              '<button id="pageLock" title="Allow page text to detach, fall, and collide" aria-label="Text physics on. Text can detach and bounce." class="active">Text physics on</button>'
          )
          text = text.replace(
              '<button id="photoPhysics" title="Profile photo can detach, bounce, and collide" aria-label="Photo ball on. The profile photo can detach and bounce." class="active">Photo ball on</button>',
              '<button id="photoPhysics" title="Profile photo can detach, bounce, and collide" aria-label="Photo physics on. The profile photo can detach and bounce." class="active">Photo physics on</button>'
          )

          text = text.replace("pageLockButton.textContent='Zen mode on';", "pageLockButton.textContent='Text physics off';")
          text = text.replace("pageLockButton.title='Enable falling text objects';", "pageLockButton.title='Enable text physics';")
          text = text.replace("pageLockButton.setAttribute('aria-label','Zen mode on. Text is fixed; photo ball physics remain active.');", "pageLockButton.setAttribute('aria-label','Text physics off. Text stays fixed.');")
          text = text.replace("pageLockButton.classList.add('active');\n    if(zenNote) zenNote.style.display='block';", "pageLockButton.classList.remove('active');\n    if(zenNote) zenNote.style.display='block';", 1)

          text = text.replace("pageLockButton.textContent='Zen mode off';", "pageLockButton.textContent='Text physics on';")
          text = text.replace("pageLockButton.title='Disable falling text objects';", "pageLockButton.title='Disable text physics';")
          text = text.replace("pageLockButton.setAttribute('aria-label','Zen mode off. Text physics enabled.');", "pageLockButton.setAttribute('aria-label','Text physics on. Text can detach and bounce.');")
          text = text.replace("pageLockButton.classList.remove('active');\n    if(zenNote) zenNote.style.display='none';", "pageLockButton.classList.add('active');\n    if(zenNote) zenNote.style.display='none';", 1)

          text = text.replace("photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo ball on' : 'Photo ball off';", "photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo physics on' : 'Photo physics off';")
          text = text.replace("? 'Photo ball on. The profile photo can detach and bounce.'", "? 'Photo physics on. The profile photo can detach and bounce.'")
          text = text.replace(": 'Photo ball off. The profile photo stays fixed.'", ": 'Photo physics off. The profile photo stays fixed.'")

          if text != original:
              path.write_text(text)

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if scripts:
              Path('/tmp/about-script.js').write_text('\n'.join(scripts))
          PY

          if [ -f /tmp/about-script.js ]; then node --check /tmp/about-script.js; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.qmd
          if ! git diff --cached --quiet; then
            git commit -m "Clarify About physics controls"
            git push origin main
          fi

      # actions/checkout refuses any `path` that escapes $GITHUB_WORKSPACE via
      # "..", so this lands *inside* the sean-data-portfolio checkout as
      # senate-ptr-scraper/ rather than as a true sibling folder (which is
      # how it looks in local development). The Quarto page's data path
      # tries both layouts and uses whichever exists.
      - name: Checkout senate-ptr-scraper (for Senate data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/senate-ptr-scraper
          path: senate-ptr-scraper

      - name: Checkout house-ptr-scraper (for House data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/house-ptr-scraper
          path: house-ptr-scraper

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::readr
            any::dplyr
            any::DT
            any::jsonlite
            any::htmltools
            any::yaml
            any::glue
            any::purrr

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
