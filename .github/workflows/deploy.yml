name: Deploy site

on:
  repository_dispatch:
    types: [senate-data-updated, house-data-updated]
  schedule:
    # Weekly fallback rebuild (Mondays 12:00 UTC) in case a dispatch is
    # ever missed, or House data is refreshed manually without a push.
    - cron: "0 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sean-data-portfolio
        uses: actions/checkout@v4

      - name: Checkout senate-ptr-scraper (for Senate data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/senate-ptr-scraper
          path: senate-ptr-scraper

      - name: Checkout house-ptr-scraper (for House data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/house-ptr-scraper
          path: house-ptr-scraper

      - name: Restore static Technician article PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          source = Path("projects/assets/park-it-here/park-it-here-sean-ryan.pdf.b64")
          target = Path("projects/assets/park-it-here/park-it-here-sean-ryan.pdf")

          encoded = re.sub(r"[^A-Za-z0-9+/=]", "", source.read_text(encoding="utf-8"))
          encoded = encoded.rstrip("=")
          encoded += "=" * (-len(encoded) % 4)
          decoded = base64.b64decode(encoded, validate=False)

          if not decoded.startswith(b"%PDF"):
              raise SystemExit("Restored asset is not a PDF")

          target.write_bytes(decoded)
          print(f"Restored {target} ({len(decoded):,} bytes)")
          PY
          file projects/assets/park-it-here/park-it-here-sean-ryan.pdf

      - name: Restore preserved Technician article
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          parts = [
              Path("projects/assets/park-it-here/archive-gzip/part-1.b64"),
              Path("projects/assets/park-it-here/archive-gzip/part-2.b64"),
              Path("projects/assets/park-it-here/archive-gzip/part-3.b64"),
              Path("projects/assets/park-it-here/archive-gzip/part-4.b64"),
          ]
          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)

          expected_gzip = "087391614c7ee362eb70e7c1d4fd20955868aeacb2ac3e233df5108a2d450950"
          actual_gzip = hashlib.sha256(compressed).hexdigest()
          if actual_gzip != expected_gzip:
              raise SystemExit(f"Technician archive gzip hash mismatch: {actual_gzip}")

          html = gzip.decompress(compressed)
          expected_html = "ba6a840d57e05afd41460a5962317d284d2c8582be52cd92ea14e38d8a36cd2b"
          actual_html = hashlib.sha256(html).hexdigest()
          if actual_html != expected_html:
              raise SystemExit(f"Technician archive HTML hash mismatch: {actual_html}")

          freeze_source = Path("projects/assets/park-it-here/technician-freeze.css.gz.b64")
          freeze_compressed = base64.b64decode(freeze_source.read_text(encoding="utf-8").strip(), validate=True)
          expected_freeze_gzip = "9be087ae08bc4624dc8fb808ff3d2fb40856143aa8e12add56f6a925b37eaafb"
          if hashlib.sha256(freeze_compressed).hexdigest() != expected_freeze_gzip:
              raise SystemExit("Technician captured CSS gzip hash mismatch")

          freeze_css = gzip.decompress(freeze_compressed)
          expected_freeze_css = "c75b6cf708ee00ce599dc6572b10b4d6560ac53a1272012628ac3e50d49f977a"
          if hashlib.sha256(freeze_css).hexdigest() != expected_freeze_css:
              raise SystemExit("Technician captured CSS hash mismatch")

          freeze_target = Path("projects/assets/park-it-here/technician-freeze.css")
          freeze_target.write_bytes(freeze_css)

          stylesheet = b'\n<link rel="stylesheet" href="technician-freeze.css" data-archive-frozen-layout="1"/>\n'
          portfolio_overrides = b'''\n<script>\n(function () {\n  var params = new URLSearchParams(window.location.search);\n  var embedDesktop = params.get("embed") === "1";\n  var forceDesktop = params.get("view") === "desktop" && (embedDesktop || window.innerWidth > 600);\n\n  if (forceDesktop) {\n    document.documentElement.classList.add("archive-force-desktop");\n  }\n  if (embedDesktop) {\n    document.documentElement.classList.add("archive-embed-desktop");\n  }\n\n  function fitEmbeddedDesktop() {\n    if (!embedDesktop) return;\n    var scale = Math.min(1, window.innerWidth / 1200);\n    document.body.style.zoom = String(scale);\n    document.body.style.minWidth = "1200px";\n  }\n\n  if (document.readyState === "loading") {\n    document.addEventListener("DOMContentLoaded", fitEmbeddedDesktop);\n  } else {\n    fitEmbeddedDesktop();\n  }\n  window.addEventListener("resize", fitEmbeddedDesktop);\n\n  /* The mobile header is visual archive chrome. Rather than opening a stale\n     menu/search UI, send both controls to the live published article. */\n  var articleUrl = "https://technicianonline.com/162505/news/park-it-here-e-bike-and-scooter-rules-differ-across-nc-state/";\n  document.addEventListener("click", function (event) {\n    var control = event.target.closest(\n      ".sno-header-wrap-mobile .sno-hac-menu-icon, .sno-header-wrap-mobile .sno-hac-search-icon"\n    );\n    if (!control) return;\n    event.preventDefault();\n    event.stopPropagation();\n    event.stopImmediatePropagation();\n    var opened = window.open(articleUrl, "_blank");\n    if (opened) opened.opener = null;\n  }, true);\n})();\n</script>\n<style id="archive-portfolio-overrides">\nhtml.archive-force-desktop .sno-header-wrap-desktop { display: block !important; }\nhtml.archive-force-desktop .sno-header-wrap-tablet,\nhtml.archive-force-desktop .sno-header-wrap-mobile { display: none !important; }\nhtml.archive-force-desktop .sno-footer-wrap-desktop,\nhtml.archive-force-desktop .sno-footer-wrap-desktop-footer { display: block !important; }\nhtml.archive-force-desktop .sno-footer-wrap-tablet,\nhtml.archive-force-desktop .sno-footer-wrap-mobile,\nhtml.archive-force-desktop .sno-footer-wrap-tablet-footer,\nhtml.archive-force-desktop .sno-footer-wrap-mobile-footer { display: none !important; }\n\n/* The Mac-window preview is a scaled desktop capture. Hide the floating\n   share rail there so it cannot cover the article while scrolling. */\nhtml.archive-embed-desktop .sno-story-social-icons {\n  display: none !important;\n}\n\n/* Direct mobile viewing keeps Technician's share controls, but moves them\n   beneath the story rather than letting them float over maps and text. */\n@media only screen and (max-width: 600px) {\n  html:not(.archive-force-desktop) .sno-story-social-icons {\n    position: static !important;\n    inset: auto !important;\n    width: auto !important;\n    height: auto !important;\n    margin: 18px 20px !important;\n    padding: 0 !important;\n    transform: none !important;\n  }\n  html:not(.archive-force-desktop) .sno-story-social-icons .sno-row-icons-side {\n    position: static !important;\n    inset: auto !important;\n    top: auto !important;\n    right: auto !important;\n    bottom: auto !important;\n    left: auto !important;\n    display: flex !important;\n    flex-direction: row !important;\n    flex-wrap: wrap !important;\n    align-items: center !important;\n    justify-content: flex-start !important;\n    gap: 8px !important;\n    width: auto !important;\n    margin: 0 !important;\n    transform: none !important;\n    z-index: auto !important;\n  }\n  html:not(.archive-force-desktop) .sno-story-social-icons .sno-row-icon {\n    float: none !important;\n    width: 42px !important;\n    height: 42px !important;\n    margin: 0 !important;\n  }\n  html:not(.archive-force-desktop) .sno-story-social-icons .print-row-icon {\n    display: none !important;\n  }\n}\n</style>\n'''
          if b"</head>" not in html:
              raise SystemExit("Preserved Technician archive is missing </head>")
          html = html.replace(b"</head>", stylesheet + portfolio_overrides + b"</head>", 1)

          target = Path("projects/assets/park-it-here/park-it-here-archive.html")
          target.write_bytes(html)
          print(f"Restored {target} ({len(html):,} bytes) with captured layout CSS")
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::readr
            any::dplyr
            any::DT
            any::jsonlite
            any::htmltools
            any::yaml
            any::glue
            any::purrr

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
