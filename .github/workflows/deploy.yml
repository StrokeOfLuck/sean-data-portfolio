name: Deploy site

on:
  repository_dispatch:
    types: [senate-data-updated, house-data-updated]
  schedule:
    # Weekly fallback rebuild (Mondays 12:00 UTC) in case a dispatch is
    # ever missed, or House data is refreshed manually without a push.
    - cron: "0 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Both workflows write gh-pages; serialize them to avoid competing pushes.
concurrency:
  group: portfolio-pages-writer
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sean-data-portfolio
        uses: actions/checkout@v4

      - name: Checkout senate-ptr-scraper (for Senate data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/senate-ptr-scraper
          path: senate-ptr-scraper

      - name: Checkout house-ptr-scraper (for House data)
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/house-ptr-scraper
          path: house-ptr-scraper

      - name: Restore housing article archive images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          folder = Path('projects/assets/housing-affordability')
          for name in ['wolf-village.jpg', 'publication-snapshot.png', 'rent-map-thumbnail.png']:
              (folder / name).write_bytes(base64.b64decode((folder / (name + '.b64')).read_text()))
          PYTHON

      - name: Capture housing snapshot with fully loaded map
        if: ${{ hashFiles('projects/assets/housing-affordability/snapshot-map-ready.json') == '' }}
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/capture_housing_snapshot.py

      - name: Checkout pinned housing graphics archive
        if: ${{ hashFiles('projects/assets/housing-affordability/graphics/technician-embed.html') == '' }}
        uses: actions/checkout@v4
        with:
          repository: StrokeOfLuck/ncsu-rent-article
          ref: e9be82f9423762715fd6eda7e0b4cc9a4f36ef09
          path: housing-archive-source

      - name: Preserve housing graphics and evidence with portfolio
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          source = Path('housing-archive-source')
          target = Path('projects/assets/housing-affordability/graphics')
          if not (target / 'technician-embed.html').exists():
              target.mkdir(parents=True, exist_ok=True)
              for name in ['assets', 'data', 'docs']:
                  shutil.copytree(source / name, target / name, dirs_exist_ok=True, ignore=shutil.ignore_patterns('.*'))
              for file in source.glob('*.html'):
                  shutil.copy2(file, target / file.name)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/housing-affordability
          if ! git diff --cached --quiet; then
            git commit -m 'Persist housing article graphics and evidence archive [skip ci]'
            git push origin HEAD:main
          fi
          rm -rf housing-archive-source

      - name: Restore static Technician article PDF
        run: |
          python3 -m scripts.restore_technician_pdf
          file projects/assets/park-it-here/park-it-here-sean-ryan.pdf

      - name: Restore preserved Technician article
        run: |
          python3 -m scripts.restore_technician_archive

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::readr
            any::dplyr
            any::DT
            any::jsonlite
            any::htmltools
            any::yaml
            any::glue
            any::purrr

      # Hosted runners may include a newer Quarto. setup@v2 cannot downgrade
      # that package, so remove it before installing our pinned version.
      - name: Remove runner-provided Quarto
        run: |
          if dpkg-query -W quarto >/dev/null 2>&1; then
            sudo apt-get remove --yes quarto
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render site
        run: quarto render

      - name: Verify mobile preview is included in the rendered homepage
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.sources.append(dict(attrs).get('src', '').split('?')[0])

          page = Scripts()
          page.feed(Path('_site/index.html').read_text(encoding='utf-8'))
          preview = 'projects/assets/cards/mobile-scroll-preview.js'
          assert preview in page.sources, 'Homepage does not load mobile scroll previews'
          assert Path('_site', preview).is_file(), 'Mobile scroll preview asset is missing'
          PY

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
