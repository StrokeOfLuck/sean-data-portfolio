name: Rename About physics controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-about-physics-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('about.qmd')
          text = path.read_text()

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing marker: {label}')
              text = text.replace(old, new, 1)

          rep(
              '<button id="pageLock" title="Keep text fixed while photo physics stay active" aria-label="Zen mode off. Text physics enabled.">Zen mode off</button>',
              '<button id="pageLock" title="Allow page text to detach, fall, and collide" aria-label="Text physics on. Text can detach and bounce." class="active">Text physics on</button>',
              'page lock button'
          )

          rep(
              '<button id="photoPhysics" title="Profile photo can detach, bounce, and collide" aria-label="Photo ball on. The profile photo can detach and bounce." class="active">Photo ball on</button>',
              '<button id="photoPhysics" title="Profile photo can detach, bounce, and collide" aria-label="Photo physics on. The profile photo can detach and bounce." class="active">Photo physics on</button>',
              'photo button'
          )

          old = '''  if(pageLocked) {
    restoreWordsOnly();
    pageLockButton.textContent='Zen mode on';
    pageLockButton.title='Enable falling text objects';
    pageLockButton.setAttribute('aria-label','Zen mode on. Text is fixed; photo ball physics remain active.');
    pageLockButton.classList.add('active');
    if(zenNote) zenNote.style.display='block';
  } else {
    pageLockButton.textContent='Zen mode off';
    pageLockButton.title='Disable falling text objects';
    pageLockButton.setAttribute('aria-label','Zen mode off. Text physics enabled.');
    pageLockButton.classList.remove('active');
    if(zenNote) zenNote.style.display='none';
  }'''

          new = '''  if(pageLocked) {
    restoreWordsOnly();
    pageLockButton.textContent='Text physics off';
    pageLockButton.title='Enable text physics';
    pageLockButton.setAttribute('aria-label','Text physics off. Text stays fixed.');
    pageLockButton.classList.remove('active');
    if(zenNote) zenNote.style.display='block';
  } else {
    pageLockButton.textContent='Text physics on';
    pageLockButton.title='Disable text physics';
    pageLockButton.setAttribute('aria-label','Text physics on. Text can detach and bounce.');
    pageLockButton.classList.add('active');
    if(zenNote) zenNote.style.display='none';
  }'''
          rep(old, new, 'setPageLocked labels')

          text = text.replace("photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo ball on' : 'Photo ball off';", "photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo physics on' : 'Photo physics off';", 1)
          text = text.replace("? 'Photo ball on. The profile photo can detach and bounce.'", "? 'Photo physics on. The profile photo can detach and bounce.'", 1)
          text = text.replace(": 'Photo ball off. The profile photo stays fixed.'", ": 'Photo physics off. The profile photo stays fixed.'", 1)

          for required in ['Text physics on','Text physics off','Photo physics on','Photo physics off']:
              if required not in text:
                  raise SystemExit(f'Missing final label: {required}')

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/about-script.js').write_text('\n'.join(scripts))
          path.write_text(text)
          PY

          node --check /tmp/about-script.js

      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.qmd
          git diff --cached --quiet && exit 0
          git commit -m "Clarify About physics controls"
          git push origin main
