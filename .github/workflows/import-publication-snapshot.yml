name: Import publication snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-publication-snapshot.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Download full-resolution Technician snapshot from Google Drive
        run: |
          python -m pip install --quiet gdown
          mkdir -p projects/assets/park-it-here
          gdown 'https://drive.google.com/uc?id=1uv6m-EcCD7kqUurfdA1AeCzws6soLr3W' \
            -O projects/assets/park-it-here/technician-publication-snapshot.png

      - name: Verify snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/assets/park-it-here/technician-publication-snapshot.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Downloaded file is not a PNG')
          if len(data) < 1_000_000:
              raise SystemExit(f'Downloaded PNG is unexpectedly small: {len(data):,} bytes')
          print(f'Verified full-resolution snapshot: {len(data):,} bytes')
          PY

      - name: Commit snapshot into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/assets/park-it-here/technician-publication-snapshot.png
          if git diff --cached --quiet; then
            echo 'Snapshot already matches repository copy.'
            exit 0
          fi
          git commit -m 'Add full-resolution Technician publication snapshot'
          git push
