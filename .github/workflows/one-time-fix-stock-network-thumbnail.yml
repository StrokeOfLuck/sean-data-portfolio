name: One-time fix stock network thumbnail

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-stock-network-thumbnail.yml

permissions:
  contents: write

jobs:
  fix-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean shifted SVG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("projects/assets/cards/congressional-stock-network-v2.svg")
          dst = Path("projects/assets/cards/congressional-stock-network-v3.svg")
          svg = src.read_text(encoding="utf-8")

          start_marker = '<line x1="1100.0" y1="495.0" x2="1050.0" y2="495.0"'
          end_marker = '<rect x="42" y="748" width="354" height="52"'

          start = svg.index(start_marker)
          end = svg.index(end_marker)

          shifted = (
              svg[:start]
              + '<g transform="translate(85 0)">'
              + svg[start:end]
              + '</g>'
              + svg[end:]
          )

          dst.write_text(shifted, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/one-time-fix-stock-network-thumbnail.yml

      - name: Commit clean SVG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/assets/cards/congressional-stock-network-v3.svg .github/workflows/one-time-fix-stock-network-thumbnail.yml
          git commit -m "Fix congressional network thumbnail SVG"
          git push
