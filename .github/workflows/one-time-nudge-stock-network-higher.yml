name: One-time nudge stock network thumbnail higher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  nudge-svg-higher:
    if: github.event.head_commit.message == 'Add one-time thumbnail higher adjustment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Move network up more
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('projects/assets/cards/congressional-stock-network-v3.svg')
          text = path.read_text(encoding='utf-8')
          old = 'transform="translate(85 -24)"'
          new = 'transform="translate(85 -60)"'
          if old not in text:
              raise SystemExit('Expected transform not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-nudge-stock-network-higher.yml

      - name: Commit thumbnail adjustment
        run: |
          git config user.name "Sean Ryan"
          git config user.email "92698057+StrokeOfLuck@users.noreply.github.com"
          git add projects/assets/cards/congressional-stock-network-v3.svg .github/workflows/one-time-nudge-stock-network-higher.yml
          git diff --cached --quiet && exit 0
          git commit -m "Nudge stock network thumbnail higher"
          git push
