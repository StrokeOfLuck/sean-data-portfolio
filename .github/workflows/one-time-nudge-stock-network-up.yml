name: One-time nudge stock network thumbnail up

on:
  push:
    paths:
      - '.github/workflows/one-time-nudge-stock-network-up.yml'

permissions:
  contents: write

jobs:
  nudge-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move network up 24px
        shell: python
        run: |
          from pathlib import Path

          path = Path('projects/assets/cards/congressional-stock-network-v3.svg')
          text = path.read_text(encoding='utf-8')
          old = '<g transform="translate(85 0)">'
          new = '<g transform="translate(85 -24)">'

          if old not in text:
              raise SystemExit(f'Expected transform not found in {path}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-nudge-stock-network-up.yml

      - name: Commit thumbnail adjustment
        run: |
          git config user.name "Sean Ryan"
          git config user.email "92698057+StrokeOfLuck@users.noreply.github.com"
          git add projects/assets/cards/congressional-stock-network-v3.svg .github/workflows/one-time-nudge-stock-network-up.yml
          git commit -m "Nudge stock network thumbnail up"
          git push
