name: Refine photo ball toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-photo-physics-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make photo ball toggle clearer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('about.qmd')
          text = path.read_text()

          replacements = [
              (
                  '    <button id="photoPhysics" title="Allow the profile photo to detach, bounce, and collide" aria-label="Photo physics on. The profile photo can detach and bounce." class="active">Photo physics on</button>',
                  '    <button id="photoPhysics" title="Profile photo can detach, bounce, and collide" aria-label="Photo ball on. The profile photo can detach and bounce." class="active">Photo ball on</button>'
              ),
              (
                  "      photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo physics on' : 'Photo physics off';",
                  "      photoPhysicsButton.textContent=photoPhysicsEnabled ? 'Photo ball on' : 'Photo ball off';"
              ),
              (
                  "          ? 'Photo physics on. The profile photo can detach and bounce.'\n          : 'Photo physics off. The profile photo stays fixed.'",
                  "          ? 'Photo ball on. The profile photo can detach and bounce.'\n          : 'Photo ball off. The profile photo stays fixed.'"
              ),
              (
                  "    if(under?.closest?.('#photoWrap') && photoWrap.dataset.detached!=='1') {",
                  "    if(photoPhysicsEnabled && under?.closest?.('#photoWrap') && photoWrap.dataset.detached!=='1') {"
              )
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          if 'Photo ball on' not in text or 'Photo ball off' not in text:
              raise SystemExit('Photo ball labels were not applied')
          if "if(photoPhysicsEnabled && under?.closest?.('#photoWrap')" not in text:
              raise SystemExit('Photo pointer guard was not applied')

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/about-script.js').write_text('\n'.join(scripts))
          path.write_text(text)
          PY

          node --check /tmp/about-script.js

      - name: Commit wording cleanup
        shell: bash
        run: |
          if git diff --quiet -- about.qmd; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.qmd
          git commit -m "Clarify photo ball physics toggle"
          git push origin main
